[project]
name = "pi-py-mcp"
version = "1.3.0"
description = "Python port of @earendil-works/pi-mcp — standalone Model Context Protocol client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Justin Gao" }]
dependencies = [
    "httpx>=0.27",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/encyc/pi-py"
Repository = "https://github.com/encyc/pi-py"
Issues = "https://github.com/encyc/pi-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_mcp"]
