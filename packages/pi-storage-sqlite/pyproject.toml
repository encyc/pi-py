[project]
name = "pi-py-storage-sqlite"
version = "0.85.1"
description = "【已废弃】转发到 pi-py-durable —— 上游对应包已于 v1.2.0 删除"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Justin Gao" }]
dependencies = [
    # 转发壳：旧数据模型在新实现里没有对应物，因此本包只重导出 pi-durable 的
    # SQLite 后端（见 PORTING.md 的并入说明）。
    "pi-py-durable",
]

classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/encyc/pi-py"
Repository = "https://github.com/encyc/pi-py"
Issues = "https://github.com/encyc/pi-py/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_storage_sqlite"]
