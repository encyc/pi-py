name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # 手动触发（补发历史版本时必须填 tag）
    inputs:
      tag:
        description: "要发布的 tag（如 v0.85.1），必须是已存在的 semver tag"
        required: true
        type: string

permissions:
  id-token: write  # OIDC Trusted Publishing
  contents: read

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 校验脚本必须取自**默认分支**，不能取自被校验的 tag。
      #
      # 原因：本仓库的发布校验工具是后加的，历史 tag（如 v0.85.1）上根本没有
      # `.github/scripts/`。若把脚本和被校验内容放在同一次检出里，补发历史版本时
      # 会在「脚本不存在」这一步就失败——而这恰恰是 `workflow_dispatch` 那个
      # tag 输入存在的意义（补发历史版本）。
      #
      # 因此这里**两次检出**：
      #   1) 默认分支 → 工作区根，只用它的 `.github/scripts/`
      #   2) 发布 tag → `release-src/`，那是**被校验**的内容
      - name: Checkout the default branch (for the verification scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout the released tag into release-src
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-src
          fetch-depth: 0  # 需要 tag 与完整历史

      # 发布前硬校验，防止「tag 与包版本不一致 / 忘写 CHANGELOG」这类发布事故。
      # 注意 workflow_dispatch 过去默认检出 main HEAD，会构建出与 tag 不符的包；
      # 现在手动触发必须指定 tag 并检出该 tag。
      - name: Verify tag, package versions and CHANGELOG
        run: |
          python3 .github/scripts/check_release_metadata.py \
            --tag "${{ github.event.release.tag_name || inputs.tag }}" \
            --root release-src

  publish:
    name: Build and publish
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the default branch (for the readback script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout the released tag into release-src
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-src

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --all-packages 覆盖 packages/ 下全部 workspace 成员：新增包不会因为
      # 忘记加进构建列表而漏发。仓库根包是 private，不会被构建/上传。
      #
      # ⚠️ 必须在 release-src 里构建：`--all-packages` 的成员集合随 tag 而定。
      # 在默认分支上构建会把**当时还不存在的包**一起发出去。
      - name: Build all workspace packages
        working-directory: release-src
        run: uv build --all-packages --out-dir ../dist

      - name: List artifacts
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # skip-existing: 跳过 PyPI 上已存在的同名文件，便于失败重试时
        # 只补传缺失的包（如 PyPI 对短时间创建多个新项目的限流 429）。
        # 注意：它也会让「其实没传上去」看起来成功——所以下一步会显式回读 PyPI。
        # 两种认证方式，任选其一：
        #
        # 方式 A — OIDC Trusted Publishing（推荐，无需 token）
        #   在 PyPI 网页为每个包添加 pending publisher：
        #     Owner: encyc  Repo: pi-py  Workflow: publish.yml
        #   配好后去掉下面 with.password 这行即可自动 OIDC 认证
        #
        # 方式 B — PyPI API token（如果无法登录 PyPI 网页配置 OIDC）
        #   生成一个 PyPI token（对所有项目有效），然后用：
        #     gh secret set PYPI_API_TOKEN --repo encyc/pi-py
        #   保留下面这行即可
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # 回读断言：skip-existing 可能掩盖「版本没上去」，这里要求每个包在
      # PyPI 上的 latest 都等于本次 tag，否则整个 job 失败。
      #
      # ⚠️ `--root release-src`：包集合随 tag 而定。用默认分支会让「当时还不存在
      # 的包」也被要求有该版本，于是补发历史版本必然失败。
      - name: Verify PyPI now serves this version
        run: |
          python3 .github/scripts/check_pypi_versions.py \
            --version "${{ github.event.release.tag_name || inputs.tag }}" \
            --root release-src \
            --retries 12 --delay 15
